event_camera_tracker:
  ros__parameters:
    event_center_topic: /full_auto_rover/event_center
    aligned_topic: /full_auto_rover/event_aligned
    snapshot_status_topic: /full_auto_rover/snapshot_status
    servo_topic: /servo_controller
    kinematics_service: /kinematics/set_pose_target
    initial_yaw: 500
    initial_z: 0.41
    min_yaw: 200
    max_yaw: 800
    min_z: 0.36
    max_z: 0.46
    x_offset: 0.0
    y_offset: 0.0
    target_pitch: 0.0
    pitch_range: [-180.0, 180.0]
    pitch_resolution: 1.0
    center_tolerance_px: 25
    yaw_gain: 0.04
    z_gain: 0.00005
    control_period_sec: 0.02
    max_yaw_step: 12
    max_z_step: 0.006
    align_stable_count: 2
    target_timeout_sec: 8.0
    capture_timeout_sec: 5.0
    return_tolerance_yaw: 4
    return_tolerance_z: 0.004
    scan_enabled: true
    scan_interval_sec: 0.02
    scan_yaw_positions: [200, 300, 400, 500, 600, 700, 800]
    scan_z: 0.41
    scan_step: 8
    publish_servo_commands: true

snapshot_sender:
  ros__parameters:
    image_topic: /depth_cam/rgb/image_raw
    aligned_topic: /full_auto_rover/event_aligned
    capture_trigger_topic: /full_auto_rover/capture_request
    snapshot_status_topic: /full_auto_rover/snapshot_status
    save_dir: /home/ubuntu/ros2_ws/src/full_Auto_Rover/saved_images
    cooldown_sec: 3.0
