event_camera_tracker:
  ros__parameters:
    event_center_topic: /full_auto_rover/event_center
    aligned_topic: /full_auto_rover/event_aligned
    servo_topic: /servo_controller
    yaw_servo_id: 1
    pitch_servo_id: 4
    initial_yaw: 500
    initial_pitch: 150
    center_tolerance_px: 25
    yaw_gain: 0.08
    pitch_gain: 0.08
    control_period_sec: 0.1
    max_yaw_step: 8
    max_pitch_step: 5
    align_stable_count: 5
    target_timeout_sec: 2.0
    scan_enabled: true
    scan_interval_sec: 1.2
    scan_yaw_positions: [250, 375, 500, 625, 750]
    scan_pitch: 150
    scan_step: 10

snapshot_sender:
  ros__parameters:
    image_topic: /depth_cam/rgb/image_raw
    aligned_topic: /full_auto_rover/event_aligned
    capture_trigger_topic: /full_auto_rover/capture_request
    snapshot_status_topic: /full_auto_rover/snapshot_status
    save_dir: /home/ubuntu/ros2_ws/src/full_Auto_Rover/saved_images
    cooldown_sec: 3.0
