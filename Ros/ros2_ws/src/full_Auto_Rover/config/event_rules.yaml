danger_event_detector:
  ros__parameters:
    object_topic: /yolov5/object_detect
    event_center_topic: /full_auto_rover/event_center
    event_status_topic: /full_auto_rover/event_status
    image_width: 640
    image_height: 480
    min_score: 0.45
    near_iou_threshold: 0.05
    near_center_distance_px: 170
    person_object_margin_px: 45
    obstacle_center_band_ratio: 0.45
    obstacle_min_area_ratio: 0.08
    fallen_person_aspect_ratio: 1.35
    weapon_classes: ['knife', 'scissors', 'baseball_bat']
    obstacle_classes: ['chair', 'bench', 'couch', 'dining_table', 'backpack', 'handbag', 'suitcase', 'bottle', 'potted_plant', 'traffic_cone']
    fire_classes: ['fire', 'flame']
    smoke_classes: ['smoke']
